<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Schedulin — Aplikasi pengatur jadwal dan rutinitas harian ceria bersama si kucing lucu. Atur kegiatan Senin-Minggu dengan tampilan kawaii dan produktif." />
    <meta name="theme-color" content="#E0F2FE" />
    <!-- Pasang tema sebelum render pertama supaya tidak ada kedipan terang di mode malam -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#090D1A');
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="alternate icon" type="image/png" href="/favicon.png" />
