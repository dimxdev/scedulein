<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Cat Gradient -->
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Sun Glow -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)" />

  <!-- Sun Rays & Glow on Top -->
  <circle cx="64" cy="40" r="18" fill="url(#sunGrad)" />
  <path d="M64 14 L64 20" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" />
  <path d="M44 22 L48 26" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" />
  <path d="M84 22 L80 26" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" />

  <!-- Cat Head Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <polygon points="34,68 40,40 58,58" fill="#F97316" />
    <polygon points="38,64 42,46 54,58" fill="#FDA4AF" />
    
    <polygon points="94,68 88,40 70,58" fill="#F97316" />
    <polygon points="90,64 86,46 74,58" fill="#FDA4AF" />

    <!-- Head Body -->
    <ellipse cx="64" cy="78" rx="38" ry="32" fill="url(#catGrad)" />

    <!-- Cute Chubby Cheeks -->
    <circle cx="48" cy="85" r="7" fill="#FDA4AF" opacity="0.8" />
    <circle cx="80" cy="85" r="7" fill="#FDA4AF" opacity="0.8" />

    <!-- Happy Eyes -->
    <ellipse cx="49" cy="74" rx="4" ry="5.5" fill="#431407" />
    <circle cx="47.5" cy="72" r="1.8" fill="#FFFFFF" />

    <ellipse cx="79" cy="74" rx="4" ry="5.5" fill="#431407" />
    <circle cx="77.5" cy="72" r="1.8" fill="#FFFFFF" />

    <!-- Whiskers -->
    <path d="M22 76 L34 78" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M22 83 L34 81" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M106 76 L94 78" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <path d="M106 83 L94 81" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nose & Smile -->
    <polygon points="61.5,80 66.5,80 64,83" fill="#BE185D" />
    <path d="M59 84 Q64 87 64 83 Q64 87 69 84" stroke="#7C2D12" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>